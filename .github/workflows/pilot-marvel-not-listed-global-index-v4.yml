name: Pilot Marvel NOT_LISTED global index v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pilot-marvel-not-listed-global-index-v4.mjs'
      - '.github/workflows/pilot-marvel-not-listed-global-index-v4.yml'

permissions:
  contents: write

concurrency:
  group: marvel-not-listed-global-index-v4-pilot
  cancel-in-progress: true

jobs:
  pilot:
    name: Build global candidate index and verify a strict pilot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate pilot syntax
        run: node --check scripts/pilot-marvel-not-listed-global-index-v4.mjs

      - name: Run global-index pilot
        run: node scripts/pilot-marvel-not-listed-global-index-v4.mjs

      - name: Publish summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/pilot-global-index.json','utf8'));
          console.log('## Marvel NOT_LISTED V4 · piloto global');
          console.log('');
          console.log(`- Catálogo discovery indexado: ${r.catalog.issues}`);
          console.log(`- NOT_LISTED analizados: ${r.candidateCoverage.total}`);
          console.log(`- Alta confianza: ${r.candidateCoverage.high}`);
          console.log(`- Confianza media: ${r.candidateCoverage.medium}`);
          console.log(`- Baja confianza: ${r.candidateCoverage.low}`);
          console.log(`- Sin candidato: ${r.candidateCoverage.none}`);
          console.log(`- Piloto oficial comprobado: ${r.pilot.checked}`);
          console.log(`- Identidad oficial exacta: ${r.pilot.exact}`);
          console.log(`- Unlimited recuperados: ${r.pilot.mu}`);
          console.log(`- NO_DIGITAL confirmados: ${r.pilot.noDigital}`);
          console.log(`- Identity mismatch: ${r.pilot.identityMismatch}`);
          console.log(`- Reader route confirmada: ${r.pilot.readerRouteConfirmed}`);
          NODE

      - name: Preserve pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: marvel-not-listed-global-v4-${{ github.run_id }}
          path: artifacts/marvel-not-listed-v4/pilot-global-index.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit pilot report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-not-listed-v4/pilot-global-index.json
          if git diff --cached --quiet; then
            echo 'El piloto no cambió.'
            exit 0
          fi
          git commit -m 'audit: guardar piloto global NOT_LISTED v4'
          git pull --rebase origin main
          git push origin HEAD:main

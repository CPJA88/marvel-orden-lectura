name: Build Marvel phase6 volume atlas v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-marvel-phase6-volume-atlas-v4.mjs'
      - '.github/workflows/build-marvel-phase6-volume-atlas-v4.yml'

permissions:
  contents: write

concurrency:
  group: build-marvel-phase6-volume-atlas-v4
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Restore global Marvel catalog
        uses: actions/cache/restore@v4
        with:
          path: .cache/marvel-global-catalog-v4.json
          key: marvel-global-catalog-v4-20260818
          fail-on-cache-miss: true
      - name: Snapshot protected files
        run: |
          sha256sum source/marvel-cache/index.json > /tmp/cache.sha
          sha256sum source/marvel-reader-fallback-v1240.js > /tmp/fallback.sha
      - name: Remove circular diagnostic assumption
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-marvel-phase6-volume-atlas-v4.mjs')
          s=p.read_text()
          start=s.index('const drnMissingIds=')
          end=s.index('const groups=', start)
          replacement="""const drnMissingIds=new Set((phase5.results||[]).filter(r=>r.kind==='drn-missing').map(r=>Number(r.gcdId)));if(drnMissingIds.size!==70)throw new Error(`DRN missing previo=${drnMissingIds.size}`);const safeIds=new Set(safeUnique.map(r=>r.gcdId));\n"""
          p.write_text(s[:start]+replacement+s[end:])
          PY
      - name: Validate phase6 atlas builder
        run: node --check scripts/build-marvel-phase6-volume-atlas-v4.mjs
      - name: Build current phase6 volume atlas
        run: node scripts/build-marvel-phase6-volume-atlas-v4.mjs
      - name: Validate read-only result
        run: |
          sha256sum -c /tmp/cache.sha
          sha256sum -c /tmp/fallback.sha
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/phase6-volume-atlas-v4.json','utf8'));
          if(r.mode!=='phase6-volume-atlas-v4'||r.writesCache!==false||r.counts.pending!==18765||r.baseline.matched!==31102||r.baseline.noDigital!==1135||r.baseline.notListed!==18765||r.baseline.functionalLinkMissing!==0)throw new Error('Atlas fase 6 inválido');
          if(r.counts.noCandidate+r.counts.candidateLinked!==18765)throw new Error('Desglose fase 6 no cuadra');console.log(JSON.stringify(r.counts,null,2));
          NODE
      - name: Add job summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/phase6-volume-atlas-v4.json','utf8'));console.log('## Fase 6 · grandes series por volumen');for(const [k,v] of Object.entries(r.counts))console.log(`- ${k}: ${v}`);console.log('');for(const x of r.volumeQueue.slice(0,30))console.log(`- ${x.title}: pending=${x.pendingCount}, linked=${x.candidateLinked}, drnMissing=${x.safeUniqueDrnMissing}, dup=${x.crossDuplicate}, ambiguous=${x.ambiguous}, terminal=${x.terminalCollision}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: marvel-phase6-volume-atlas-v4-${{ github.run_id }}
          path: artifacts/marvel-not-listed-v4/phase6-volume-atlas-v4.json
          retention-days: 14
      - name: Commit research result only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-not-listed-v4/phase6-volume-atlas-v4.json
          git commit -m 'audit: guardar atlas fase 6 por volumen v4' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Audit Marvel identity mismatch links v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-marvel-identity-mismatch-links-v4.mjs'
      - '.github/workflows/audit-marvel-identity-mismatch-links-v4.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate link auditor
        run: node --check scripts/audit-marvel-identity-mismatch-links-v4.mjs
      - name: Audit 429 functional links
        run: node scripts/audit-marvel-identity-mismatch-links-v4.mjs
      - name: Publish summary
        run: cat artifacts/marvel-not-listed-v4/identity-mismatch-link-audit.json | head -n 40
      - uses: actions/upload-artifact@v4
        with:
          name: marvel-identity-mismatch-links-v4-${{ github.run_id }}
          path: artifacts/marvel-not-listed-v4/identity-mismatch-link-audit.json
          retention-days: 14
      - name: Commit research result only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-not-listed-v4/identity-mismatch-link-audit.json
          git commit -m 'audit: guardar enlaces identity mismatch v4' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

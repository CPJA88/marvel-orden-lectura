name: Publish Marvel alias series harvest v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-marvel-alias-series-harvest-v4.mjs'
      - '.github/workflows/publish-marvel-alias-series-harvest-v4.yml'

permissions:
  contents: write

concurrency:
  group: publish-marvel-alias-series-harvest-v4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate series publisher
        run: node --check scripts/publish-marvel-alias-series-harvest-v4.mjs
      - name: Publish 31 MU and 4 NO_DIGITAL
        run: node scripts/publish-marvel-alias-series-harvest-v4.mjs
      - name: Validate reader fallback
        run: |
          node --check source/marvel-reader-fallback-v1240.js
          node scripts/test-marvel-reader-fallback-v1240.mjs
      - name: Build PWA
        run: npm run build
      - name: Validate published build
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/alias-series-harvest-publish-summary-v4.json','utf8'));
          const c=JSON.parse(fs.readFileSync('source/marvel-cache/index.json','utf8'));
          if(s.changedRows!==35||s.promotedMU!==31||s.confirmedNoDigital!==4||s.remainingFrom54!==19||s.unchangedRows!==50967)throw new Error('Resumen de publicación inesperado');
          if(c.localCount!==51002||c.matched!==29137||c.noDigital!==1135||c.notListed!==20730||c.linkReady!==25322||c.readerFallbackReady!==3815||c.functionalLinkReady!==29137||c.functionalLinkMissing!==0)throw new Error('Conteos finales inesperados');
          const src=fs.readFileSync('source/marvel-reader-fallback-v1240.js','utf8');
          const pub=fs.readFileSync('public/marvel-reader-fallback-v1240.js','utf8');
          if(src!==pub)throw new Error('Fallback source/public no coincide');
          NODE
      - name: Commit verified series publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/marvel-cache/index.json source/marvel-reader-fallback-v1240.js artifacts/marvel-not-listed-v4/alias-series-harvest-publish-summary-v4.json
          git commit -m 'cache: publicar 35 resultados por series oficiales v4'
          git pull --rebase origin main
          git push origin HEAD:main

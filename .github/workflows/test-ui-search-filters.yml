name: Test UI search and filters

on:
  push:
    paths:
      - 'scripts/test-ui-search-filters.mjs'
      - '.github/workflows/test-ui-search-filters.yml'
      - 'source/app.js'
      - 'source/index.html'
      - 'Marvel_Orden_de_Lectura_PWA.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-search-filter-diagnostic
  cancel-in-progress: true

jobs:
  test-ui-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test search and filter data contract
        id: test
        continue-on-error: true
        run: node scripts/test-ui-search-filters.mjs
      - name: Publish diagnostic report
        if: always()
        run: |
          test -f artifacts/ui-search-filter-diagnostic.json || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/ui-search-filter-diagnostic.json
          if git diff --cached --quiet; then
            echo 'El informe no ha cambiado.'
          else
            git commit -m 'diagnóstico: resultado de búsqueda y filtros'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-search-filter-diagnostic-${{ github.run_id }}
          path: artifacts/ui-search-filter-diagnostic.json
          retention-days: 3
          if-no-files-found: warn
      - name: Fail if contract is broken
        if: steps.test.outcome == 'failure'
        run: exit 1

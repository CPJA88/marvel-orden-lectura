name: Test UI search and filters

on:
  push:
    paths:
      - 'scripts/test-ui-search-filters.mjs'
      - 'scripts/test-ui-search-filters-v132.mjs'
      - 'scripts/prepare.mjs'
      - '.github/workflows/test-ui-search-filters.yml'
      - 'source/app.js'
      - 'source/index.html'
      - 'source/search-filter-fix-v132.js'
      - 'Marvel_Orden_de_Lectura_PWA.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-search-filter-diagnostic
  cancel-in-progress: true

jobs:
  test-ui-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate search/filter patch syntax
        id: syntax
        continue-on-error: true
        run: node --check source/search-filter-fix-v132.js
      - name: Build PWA
        id: build
        continue-on-error: true
        run: npm run build
      - name: Validate built patch
        id: built
        continue-on-error: true
        run: |
          grep -q 'search-filter-fix-v132.js' public/index.html
          grep -q 'search-filter-fix-v132.js' public/sw.js
          ! grep -q 'search-filter-fix-v131.js' public/index.html
      - name: Test search and filter data contract
        id: data
        continue-on-error: true
        run: node scripts/test-ui-search-filters.mjs
      - name: Test real global filtering behavior
        id: behavior
        continue-on-error: true
        run: node scripts/test-ui-search-filters-v132.mjs
      - name: Write CI result
        if: always()
        run: |
          mkdir -p artifacts
          cat > artifacts/ui-search-filter-ci-status.json <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "syntax": "${{ steps.syntax.outcome }}",
            "build": "${{ steps.build.outcome }}",
            "builtPatch": "${{ steps.built.outcome }}",
            "dataContract": "${{ steps.data.outcome }}",
            "behavior": "${{ steps.behavior.outcome }}"
          }
          JSON
      - name: Publish diagnostic report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/ui-search-filter-ci-status.json
          if test -f artifacts/ui-search-filter-diagnostic.json; then git add artifacts/ui-search-filter-diagnostic.json; fi
          if test -f artifacts/ui-filter-v132-behavior.json; then git add artifacts/ui-filter-v132-behavior.json; fi
          if git diff --cached --quiet; then
            echo 'Los informes no han cambiado.'
          else
            git commit -m 'diagnóstico: validar búsqueda y filtros v1.2.32'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-search-filter-diagnostic-${{ github.run_id }}
          path: |
            artifacts/ui-search-filter-diagnostic.json
            artifacts/ui-filter-v132-behavior.json
            artifacts/ui-search-filter-ci-status.json
          retention-days: 3
          if-no-files-found: warn
      - name: Fail if UI validation is broken
        if: steps.syntax.outcome == 'failure' || steps.build.outcome == 'failure' || steps.built.outcome == 'failure' || steps.data.outcome == 'failure' || steps.behavior.outcome == 'failure'
        run: exit 1

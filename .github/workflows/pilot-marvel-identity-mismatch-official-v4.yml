name: Pilot Marvel identity mismatch official v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pilot-marvel-identity-mismatch-official-v4.mjs'
      - '.github/workflows/pilot-marvel-identity-mismatch-official-v4.yml'

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate rechecker
        run: node --check scripts/pilot-marvel-identity-mismatch-official-v4.mjs
      - name: Recheck 429 candidates on official Marvel pages
        run: node scripts/pilot-marvel-identity-mismatch-official-v4.mjs
      - name: Publish summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/identity-mismatch-official-pilot.json','utf8'));
          const s=r.summary;
          console.log('## Identity mismatch · revalidación oficial');
          for(const [k,v] of Object.entries(s))console.log(`- ${k}: ${v}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: marvel-identity-mismatch-official-v4-${{ github.run_id }}
          path: artifacts/marvel-not-listed-v4/identity-mismatch-official-pilot.json
          retention-days: 14
          if-no-files-found: error
      - name: Commit research result only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-not-listed-v4/identity-mismatch-official-pilot.json
          git commit -m 'audit: guardar revalidación identity mismatch v4'
          git pull --rebase origin main
          git push origin HEAD:main

name: Audit Marvel Unlimited links

on:
  workflow_run:
    workflows: ['Prebuild Marvel cache', 'Audit official Marvel Unlimited coverage']
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-marvel-unlimited-links.mjs'
      - 'scripts/prepare-marvel-link-audit-checkpoint-v3.mjs'
      - 'scripts/repair-marvel-missing-drn.mjs'
      - '.github/workflows/audit-marvel-unlimited-links.yml'

permissions:
  contents: write

concurrency:
  group: marvel-unlimited-link-audit
  cancel-in-progress: true

jobs:
  audit-links:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate auditor syntax
        run: |
          node --check scripts/audit-marvel-unlimited-links.mjs
          node --check scripts/prepare-marvel-link-audit-checkpoint-v3.mjs
          node --check scripts/repair-marvel-missing-drn.mjs

      - name: Restore link-audit checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .cache/marvel-link-audit-v1
          key: marvel-link-audit-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            marvel-link-audit-${{ runner.os }}-

      - name: Resolve missing DRNs through alternate official routes
        run: node scripts/repair-marvel-missing-drn.mjs

      - name: Reuse only unchanged previously verified deeplinks
        run: node scripts/prepare-marvel-link-audit-checkpoint-v3.mjs

      - name: Verify every Marvel Unlimited DRN and hyperlink
        id: audit
        continue-on-error: true
        env:
          LINK_VERIFY_CONCURRENCY: '2'
        run: node scripts/audit-marvel-unlimited-links.mjs

      - name: Save link-audit checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/marvel-link-audit-v1
          key: marvel-link-audit-${{ runner.os }}-${{ github.run_id }}

      - name: Preserve audit report and repaired candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marvel-unlimited-link-audit-${{ github.run_id }}
          path: |
            artifacts/marvel-unlimited-link-audit.json
            source/marvel-cache/index.json
          retention-days: 7
          if-no-files-found: warn

      - name: Validate publishable audited state
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/marvel-unlimited-link-audit.json','utf8'));
          if(Number(r.unlimitedTargets)!==25329) throw new Error(`Targets inesperados: ${r.unlimitedTargets}`);
          if(Number(r.passed)+Number(r.failed)!==Number(r.unlimitedTargets)) throw new Error('El informe no cubre todos los targets');
          if(Number(r.hardFailed)!==0) throw new Error(`Hay ${r.hardFailed} enlaces realmente rotos; no se publica`);
          if(Number(r.failed)!==Number(r.missingDrn)||Number(r.failed)!==Number(r.linkMissing)) {
            throw new Error(`Fallos no explicados solo por DRN faltantes: failed=${r.failed}, missingDrn=${r.missingDrn}, linkMissing=${r.linkMissing}`);
          }
          if(Number(r.passed)<25322) throw new Error(`Se perdieron enlaces previamente verificados: ${r.passed}`);
          console.log(`Estado publicable: ${r.passed}/${r.unlimitedTargets} verificados; ${r.linkMissing} pendientes exclusivamente por DRN; hardFailed=0.`);
          NODE

      - name: Commit audited cache, including isolated missing-DRN cases
        if: always()
        run: |
          if git diff --quiet -- source/marvel-cache/index.json; then
            echo 'La auditoría no cambió la caché.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/marvel-cache/index.json
          git commit -m 'cache: publicar 25322 deeplinks verificados y aislar 7 DRN pendientes'
          git pull --rebase origin main
          git push origin HEAD:main

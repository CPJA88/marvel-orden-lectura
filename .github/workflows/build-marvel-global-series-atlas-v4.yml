name: Build Marvel global series atlas v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-marvel-global-series-atlas-v4.mjs'
      - '.github/workflows/build-marvel-global-series-atlas-v4.yml'

permissions:
  contents: write

concurrency:
  group: build-marvel-global-series-atlas-v4
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Restore global Marvel catalog
        uses: actions/cache/restore@v4
        with:
          path: .cache/marvel-global-catalog-v4.json
          key: marvel-global-catalog-v4-20260818
          fail-on-cache-miss: true
      - name: Validate atlas builder
        run: node --check scripts/build-marvel-global-series-atlas-v4.mjs
      - name: Build read-only global series atlas
        run: node scripts/build-marvel-global-series-atlas-v4.mjs
      - name: Validate atlas and read-only scope
        run: |
          git diff --exit-code -- source/marvel-cache/index.json source/marvel-reader-fallback-v1240.js
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/global-series-atlas-v4.json','utf8'));
          if(p.mode!=='global-series-atlas-v4'||p.writesCache!==false) throw new Error('Atlas no es read-only');
          if(p.baseline.localCount!==51002||p.baseline.matched!==29155||p.baseline.noDigital!==1135||p.baseline.notListed!==20712||p.baseline.functionalLinkMissing!==0) throw new Error('Baseline incorrecta');
          if(p.totals.pendingRows!==20712||!p.totals.pendingSeries) throw new Error('Cobertura del atlas incompleta');
          console.log(JSON.stringify({totals:p.totals,concentration:p.concentration,top10:p.topByPending.slice(0,10).map(x=>({seriesId:x.seriesId,title:x.title,seriesYear:x.seriesYear,pending:x.pendingCount,historicalMU:x.historicalMU,auditedAnchors:x.auditedPublishedAnchorCount,uniquePotential:x.catalogPotential.uniqueTotal,strategy:x.strategy}))},null,2));
          NODE
      - name: Upload atlas
        uses: actions/upload-artifact@v4
        with:
          name: marvel-global-series-atlas-v4
          path: artifacts/marvel-not-listed-v4/global-series-atlas-v4.json
          retention-days: 14
      - name: Commit research atlas only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-not-listed-v4/global-series-atlas-v4.json
          git commit -m 'audit: guardar Atlas Global de Series v4' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Classify Marvel phase6 terminal ownership strict v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/classify-marvel-phase6-terminal-ownership-strict-v4.mjs'
      - '.github/workflows/classify-marvel-phase6-terminal-ownership-strict-v4.yml'

permissions:
  contents: write

concurrency:
  group: classify-marvel-phase6-terminal-ownership-strict-v4
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Snapshot protected files
        run: |
          sha256sum source/marvel-cache/index.json > /tmp/cache.sha
          sha256sum source/marvel-reader-fallback-v1240.js > /tmp/fallback.sha
      - name: Validate strict ownership classifier
        run: node --check scripts/classify-marvel-phase6-terminal-ownership-strict-v4.mjs
      - name: Classify strict ownership
        run: node scripts/classify-marvel-phase6-terminal-ownership-strict-v4.mjs
      - name: Validate read-only result
        run: |
          sha256sum -c /tmp/cache.sha
          sha256sum -c /tmp/fallback.sha
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/phase6-terminal-ownership-strict-v4.json','utf8')),s=r.summary||{};
          if(r.mode!=='phase6-terminal-ownership-strict-v4'||r.writesCache!==false||r.baseline.matched!==31177||r.baseline.noDigital!==1135||r.baseline.notListed!==18690||r.baseline.functionalLinkReady!==31177||r.baseline.functionalLinkMissing!==0)throw new Error('Informe strict ownership inválido');
          if(s.inputSafeOwnership!==20||s.strictReassignable+s.rejected!==20||s.uniquePendingGcd!==s.strictReassignable||s.uniqueOwnerGcd!==s.strictReassignable||s.writesCache!==false)throw new Error('Desglose strict ownership inválido');
          console.log(JSON.stringify(s,null,2));
          NODE
      - name: Add job summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/phase6-terminal-ownership-strict-v4.json','utf8'));console.log('## Fase 6 · filtro estricto de propiedad');for(const [k,v] of Object.entries(r.summary))console.log(`- ${k}: ${v}`);for(const x of r.strict)console.log(`- ${x.gcdId} <= owner ${x.ownerGcdId} · ${x.title} #${x.issueNumber}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: marvel-phase6-terminal-ownership-strict-v4-${{ github.run_id }}
          path: artifacts/marvel-not-listed-v4/phase6-terminal-ownership-strict-v4.json
          retention-days: 14
      - name: Commit research result only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-not-listed-v4/phase6-terminal-ownership-strict-v4.json
          git commit -m 'audit: guardar filtro estricto de propiedad terminal fase 6 v4' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

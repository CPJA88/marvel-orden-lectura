name: Publish Marvel phase6 structural 19 v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-marvel-phase6-structural-19-v4.mjs'
      - '.github/workflows/publish-marvel-phase6-structural-19-v4.yml'

permissions:
  contents: write

concurrency:
  group: publish-marvel-phase6-structural-19-v4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Snapshot reader fallback
        run: sha256sum source/marvel-reader-fallback-v1240.js > /tmp/fallback.sha
      - name: Validate publisher
        run: node --check scripts/publish-marvel-phase6-structural-19-v4.mjs
      - name: Publish 19 verified UUID deeplinks
        run: node scripts/publish-marvel-phase6-structural-19-v4.mjs
      - name: Verify fallback unchanged
        run: sha256sum -c /tmp/fallback.sha
      - name: Validate reader fallbacks
        run: node scripts/test-marvel-reader-fallback-v1240.mjs
      - name: Build PWA
        run: npm run build
      - name: Validate final cache
        run: |
          node - <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('source/marvel-cache/index.json','utf8'));const s=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/phase6-structural-19-publish-summary-v4.json','utf8'));
          if(p.entries.length!==51002||p.matched!==31121||p.noDigital!==1135||p.notListed!==18746||p.linkReady!==27288||p.readerFallbackReady!==3833||p.functionalLinkReady!==31121||p.functionalLinkMissing!==0)throw new Error('Conteos finales incorrectos');
          if(s.changedRows!==19||s.promotedMU!==19||s.promotedUuid!==19||s.drnMissingKeptPending!==1||s.duplicateLosersKeptPending!==19||s.ambiguousUnresolved!==2||s.terminalCollisionsUntouched!==27||s.unchangedRows!==50983)throw new Error('Scope final incorrecto');console.log(JSON.stringify(s.after,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: marvel-phase6-structural-19-publish-${{ github.run_id }}
          path: artifacts/marvel-not-listed-v4/phase6-structural-19-publish-summary-v4.json
          retention-days: 14
      - name: Commit verified phase6 structural publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/marvel-cache/index.json artifacts/marvel-not-listed-v4/phase6-structural-19-publish-summary-v4.json
          git commit -m 'cache: publicar 19 conflictos estructurales verificados v4' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

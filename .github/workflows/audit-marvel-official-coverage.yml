name: Audit official Marvel Unlimited coverage

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-marvel-official-coverage.mjs'
      - '.github/workflows/audit-marvel-official-coverage.yml'

permissions:
  contents: write

env:
  SHARD_COUNT: 8

concurrency:
  group: marvel-official-coverage
  cancel-in-progress: false

jobs:
  pilot:
    name: Verify official search pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate coverage auditor syntax
        run: node --check scripts/audit-marvel-official-coverage.mjs
      - name: Verify Strange Tales regression against Marvel official
        run: node scripts/audit-marvel-official-coverage.mjs pilot
      - name: Preserve pilot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-coverage-pilot-${{ github.run_id }}
          path: artifacts/official-coverage/pilot.json
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  scan:
    name: Scan NOT_LISTED shard ${{ matrix.shard }}
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore official coverage checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .cache/marvel-official-coverage-v1
          key: official-coverage-${{ runner.os }}-${{ hashFiles('source/marvel-cache/index.json') }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            official-coverage-${{ runner.os }}-${{ hashFiles('source/marvel-cache/index.json') }}-${{ matrix.shard }}-
      - name: Search every unresolved comic on official Marvel
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
          COVERAGE_CONCURRENCY: 1
        run: node scripts/audit-marvel-official-coverage.mjs scan
      - name: Save official coverage checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/marvel-official-coverage-v1
          key: official-coverage-${{ runner.os }}-${{ hashFiles('source/marvel-cache/index.json') }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-coverage-shard-${{ matrix.shard }}
          path: artifacts/official-coverage/shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  merge:
    name: Merge verified official coverage
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: official-coverage-shard-*
          path: artifacts/official-coverage
          merge-multiple: true
      - name: Merge official results into preinstalled cache
        env:
          SHARD_COUNT: 8
        run: node scripts/audit-marvel-official-coverage.mjs merge
      - name: Strictly validate merged coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('source/marvel-cache/index.json','utf8'));
          if(!p.ready||p.localCount<50000||p.officiallyVerified!==true)throw new Error('Caché base inválida');
          if(!p.officialCoverageAudit?.completed)throw new Error('Auditoría oficial incompleta');
          if(p.unknown||p.ambiguous)throw new Error(`unknown=${p.unknown}, ambiguous=${p.ambiguous}`);
          const st=p.entries.find(r=>Number(r[0])===8972);
          if(!st||![1,5].includes(Number(st[3]))||Number(st[1])!==11016)throw new Error('Strange Tales #1 sigue sin Unlimited oficial');
          console.log(JSON.stringify({matched:p.matched,notListed:p.notListed,noDigital:p.noDigital,linkReady:p.linkReady,linkMissing:p.linkMissing,audit:p.officialCoverageAudit},null,2));
          NODE
      - name: Preserve merged candidate
        uses: actions/upload-artifact@v4
        with:
          name: marvel-cache-official-coverage-${{ github.run_id }}
          path: |
            source/marvel-cache/index.json
            artifacts/official-coverage/summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Commit officially audited coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/marvel-cache/index.json artifacts/official-coverage/summary.json
          git commit -m 'cache: completar cobertura contra búsqueda oficial Marvel'
          git pull --rebase origin main
          git push origin HEAD:main

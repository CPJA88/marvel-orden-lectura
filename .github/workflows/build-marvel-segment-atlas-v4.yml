name: Build Marvel segment atlas v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-marvel-segment-atlas-v4.mjs'
      - '.github/workflows/build-marvel-segment-atlas-v4.yml'

permissions:
  contents: write

concurrency:
  group: build-marvel-segment-atlas-v4
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Restore global Marvel catalog
        uses: actions/cache/restore@v4
        with:
          path: .cache/marvel-global-catalog-v4.json
          key: marvel-global-catalog-v4-20260818
          fail-on-cache-miss: true
      - name: Snapshot protected files
        run: |
          sha256sum source/marvel-cache/index.json > /tmp/marvel-cache.before
          sha256sum source/marvel-reader-fallback-v1240.js > /tmp/marvel-fallback.before
      - name: Validate segment atlas builder
        run: node --check scripts/build-marvel-segment-atlas-v4.mjs
      - name: Build read-only segment atlas
        run: node scripts/build-marvel-segment-atlas-v4.mjs
      - name: Verify protected files unchanged
        run: |
          sha256sum -c /tmp/marvel-cache.before
          sha256sum -c /tmp/marvel-fallback.before
      - name: Validate atlas result
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/segment-atlas-v4.json','utf8'));
          if(p.mode!=='segment-atlas-v4'||p.writesCache!==false) throw new Error('Modo de atlas incorrecto');
          if(p.baseline.matched!==29155||p.baseline.noDigital!==1135||p.baseline.notListed!==20712||p.baseline.functionalLinkMissing!==0) throw new Error('Baseline incorrecta');
          if(p.totals.pendingRows!==20712||p.totals.rawUniqueCatalogCandidates!==2055) throw new Error('Cobertura de atlas incorrecta');
          if(p.totals.safeUniqueCatalogCandidates+p.totals.crossPendingDuplicateAffectedRows!==2055) throw new Error('Desglose de sourceId incorrecto');
          console.log(JSON.stringify(p.totals,null,2));
          console.log(JSON.stringify(p.topCertificationQueue.slice(0,20),null,2));
          NODE
      - name: Upload segment atlas
        uses: actions/upload-artifact@v4
        with:
          name: marvel-segment-atlas-v4
          path: artifacts/marvel-not-listed-v4/segment-atlas-v4.json
          retention-days: 14
      - name: Commit research result only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-not-listed-v4/segment-atlas-v4.json
          git commit -m 'audit: guardar Atlas de Segmentos Marvel v4' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Pilot Marvel NOT_LISTED strict series map v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pilot-marvel-not-listed-series-map-strict-v4.mjs'
      - '.github/workflows/pilot-marvel-not-listed-series-map-strict-v4.yml'

permissions:
  contents: write

concurrency:
  group: marvel-not-listed-series-map-strict-v4
  cancel-in-progress: true

jobs:
  pilot:
    name: Strictly recover NOT_LISTED through anchored series
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore global Marvel discovery catalog
        uses: actions/cache@v4
        with:
          path: .cache/marvel-global-catalog-v4.json
          key: marvel-global-catalog-v4-20260818

      - name: Validate strict pilot syntax
        run: node --check scripts/pilot-marvel-not-listed-series-map-strict-v4.mjs

      - name: Run strict anchored-series pilot
        run: node scripts/pilot-marvel-not-listed-series-map-strict-v4.mjs

      - name: Publish summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/pilot-series-map-strict.json','utf8'));
          console.log('## Marvel NOT_LISTED V4 · series ancladas estrictas');
          console.log('');
          console.log(`- Series con mapeo confiable: ${r.seriesMappings.trusted}`);
          console.log(`- Rechazadas por época: ${r.seriesMappings.rejectedSeriesYear}`);
          console.log(`- Rechazadas por fechas de ancla: ${r.seriesMappings.rejectedAnchorDates}`);
          console.log(`- NOT_LISTED candidatos estrictos: ${r.candidateRecovery.strictAnchoredCandidates}`);
          console.log(`- Piloto oficial: ${r.pilot.checked}`);
          console.log(`- Unlimited: ${r.pilot.mu}`);
          console.log(`- NO_DIGITAL: ${r.pilot.noDigital}`);
          console.log(`- Mismatch remoto: ${r.pilot.remoteIdentityMismatch}`);
          console.log(`- Fuera de época: ${r.pilot.badSeriesEra}`);
          console.log(`- Fuera de ventana de fecha: ${r.pilot.badDateWindow}`);
          console.log(`- Reader route confirmada: ${r.pilot.readerRouteConfirmed}`);
          NODE

      - name: Preserve strict pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: marvel-not-listed-series-map-strict-v4-${{ github.run_id }}
          path: artifacts/marvel-not-listed-v4/pilot-series-map-strict.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit strict pilot report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-not-listed-v4/pilot-series-map-strict.json
          if git diff --cached --quiet; then
            echo 'El piloto no cambió.'
            exit 0
          fi
          git commit -m 'audit: guardar piloto estricto de series NOT_LISTED v4'
          git pull --rebase origin main
          git push origin HEAD:main

name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - android-apk
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug instalable
        run: gradle -p android-app --no-daemon :app:assembleDebug

      - name: Preparar APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Marvel-Orden-de-Lectura.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Marvel-Orden-de-Lectura-APK
          path: Marvel-Orden-de-Lectura.apk
          if-no-files-found: error
          retention-days: 30

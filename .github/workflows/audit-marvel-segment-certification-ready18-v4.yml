name: Audit Marvel segment certification ready 18 v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-marvel-segment-certification-ready18-v4.mjs'
      - '.github/workflows/audit-marvel-segment-certification-ready18-v4.yml'

permissions:
  contents: write

concurrency:
  group: audit-marvel-segment-certification-ready18-v4
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Snapshot protected files
        run: |
          sha256sum source/marvel-cache/index.json > /tmp/cache.sha
          sha256sum source/marvel-reader-fallback-v1240.js > /tmp/fallback.sha
      - name: Validate certification auditor
        run: node --check scripts/audit-marvel-segment-certification-ready18-v4.mjs
      - name: Certify remaining 18 ready segments
        run: node scripts/audit-marvel-segment-certification-ready18-v4.mjs
      - name: Verify read-only safety
        run: |
          sha256sum -c /tmp/cache.sha
          sha256sum -c /tmp/fallback.sha
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/segment-certification-ready18-v4.json','utf8'));
          if(r.writesCache!==false||r.summary.targetSegments!==18) throw new Error('Scope incorrecto');
          if(r.baseline.matched!==29189||r.baseline.noDigital!==1135||r.baseline.notListed!==20678||r.baseline.functionalLinkMissing!==0) throw new Error('Baseline alterada');
          console.log(JSON.stringify(r.summary,null,2));
          NODE
      - name: Add job summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/segment-certification-ready18-v4.json','utf8'));
          console.log('## Segment certification ready 18 v4');
          for(const [k,v] of Object.entries(r.summary)) console.log(`- ${k}: ${v}`);
          console.log('');
          for(const s of r.segments) console.log(`- ${s.certified?'✅':'❌'} ${s.localTitle} → ${s.remoteSeriesName}: ${s.anchors.filter(a=>a.ok).length}/${s.anchorCount} anclas; pendientes=${s.pendingUniqueCount}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: marvel-segment-certification-ready18-v4-${{ github.run_id }}
          path: artifacts/marvel-not-listed-v4/segment-certification-ready18-v4.json
          retention-days: 14
      - name: Commit research result only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-not-listed-v4/segment-certification-ready18-v4.json
          git commit -m 'audit: certificar los otros 18 segmentos ready v4' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

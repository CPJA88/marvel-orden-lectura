name: Publish Marvel hard tail 18 v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-marvel-hard-tail-18-v4.mjs'
      - '.github/workflows/publish-marvel-hard-tail-18-v4.yml'

permissions:
  contents: write

concurrency:
  group: publish-marvel-hard-tail-18-v4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Repair hard-tail publisher source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/publish-marvel-hard-tail-18-v4.mjs')
          s=p.read_text()
          start=s.index('function renderFallback(targets){')
          end=s.index('function recompute(pack){')
          fixed=r'''function renderFallback(targets){
            const rows=[...targets.entries()].sort((a,b)=>a[0]-b[0]).map(([id,r])=>`    [${id},'${r}'],`).join('\n');
            return [
              '/* Marvel Lector v1.2.50 — fallback reader oficial verificado; generado por auditoría */',
              '(() => {',
              "  const SMART_BASE='https://marvel.smart.link/fiir7ec77';",
              '  const TARGETS=new Map([',
              rows,
              '  ]);',
              "  function readerFallbackHref(m){if(!m||Number(m.preinstalledStatus)!==5)return '';const expected=TARGETS.get(Number(m.id));const readerId=String(m.readerId||'').trim();if(!expected||readerId!==expected||!/^\\d+$/.test(readerId))return '';return SMART_BASE+'?type=reader&drn='+encodeURIComponent(readerId);}",
              "  if(typeof unlimitedState==='function'){const base=unlimitedState;unlimitedState=function(m){if(readerFallbackHref(m))return{label:'Unlimited ✓',cls:'available'};return base(m);};}",
              "  if(typeof stableAppHref==='function'){const base=stableAppHref;stableAppHref=function(x,s){const m=typeof state!=='undefined'&&state?.marvel?state.marvel.get(Number(x?.id)):null;return readerFallbackHref(m)||base(x,s);};}",
              "  function repaintTargets(){if(typeof state==='undefined'||!state?.marvel||typeof updateRenderedMeta!=='function')return;for(const id of TARGETS.keys()){const m=state.marvel.get(id);if(m)updateRenderedMeta(id,m)}}",
              "  if(typeof requestAnimationFrame==='function')requestAnimationFrame(repaintTargets);if(typeof setTimeout==='function'){setTimeout(repaintTargets,500);setTimeout(repaintTargets,1800)}",
              '})();',
              ''
            ].join('\n');
          }
          '''
          p.write_text(s[:start]+fixed+s[end:])
          PY
      - name: Validate hard-tail publisher
        run: node --check scripts/publish-marvel-hard-tail-18-v4.mjs
      - name: Publish exactly 18 strict hard-tail MU
        run: node scripts/publish-marvel-hard-tail-18-v4.mjs
      - name: Validate reader fallback
        run: node scripts/test-marvel-reader-fallback-v1240.mjs
      - name: Build PWA
        run: npm run build
      - name: Validate published build
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('source/marvel-cache/index.json','utf8'));
          const s=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/hard-tail-18-publish-summary-v4.json','utf8'));
          if(p.entries.length!==51002||p.matched!==29155||p.noDigital!==1135||p.notListed!==20712||p.readerFallbackReady!==3833||p.functionalLinkReady!==29155||p.functionalLinkMissing!==0) throw new Error('Conteos finales incorrectos');
          if(s.changedRows!==18||s.promotedMU!==18||s.confirmedNoDigital!==0||s.unchangedRows!==50984) throw new Error('Scope final incorrecto');
          console.log(JSON.stringify(s.after,null,2));
          NODE
      - name: Commit verified hard-tail publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publish-marvel-hard-tail-18-v4.mjs source/marvel-cache/index.json source/marvel-reader-fallback-v1240.js artifacts/marvel-not-listed-v4/hard-tail-18-publish-summary-v4.json
          git commit -m 'cache: publicar 18 hard-tail verificados' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

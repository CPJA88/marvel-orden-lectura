name: Audit Marvel phase6 structural conflicts v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-marvel-phase6-structural-conflicts-v4.mjs'
      - '.github/workflows/audit-marvel-phase6-structural-conflicts-v4.yml'

permissions:
  contents: write

concurrency:
  group: audit-marvel-phase6-structural-conflicts-v4
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Restore global Marvel catalog
        uses: actions/cache/restore@v4
        with:
          path: .cache/marvel-global-catalog-v4.json
          key: marvel-global-catalog-v4-20260818
          fail-on-cache-miss: true
      - name: Snapshot protected files
        run: |
          sha256sum source/marvel-cache/index.json > /tmp/cache.sha
          sha256sum source/marvel-reader-fallback-v1240.js > /tmp/fallback.sha
      - name: Validate structural conflict auditor
        run: node --check scripts/audit-marvel-phase6-structural-conflicts-v4.mjs
      - name: Audit structural conflicts
        run: node scripts/audit-marvel-phase6-structural-conflicts-v4.mjs
      - name: Validate read-only result
        run: |
          sha256sum -c /tmp/cache.sha
          sha256sum -c /tmp/fallback.sha
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/phase6-structural-conflicts-v4.json','utf8'));
          if(r.mode!=='phase6-structural-conflicts-v4'||r.writesCache!==false)throw new Error('Informe inválido');
          if(r.baseline.matched!==31102||r.baseline.noDigital!==1135||r.baseline.notListed!==18765||r.baseline.functionalLinkMissing!==0)throw new Error('Baseline inválida');
          if(r.summary.structuralTargets!==68||r.summary.duplicateSourceGroups!==19||r.summary.duplicateAffectedRows!==38||r.summary.ambiguousRows!==3||r.summary.terminalCollisionRows!==27)throw new Error('Universo estructural inesperado');
          console.log(JSON.stringify(r.summary,null,2));
          NODE
      - name: Add job summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/phase6-structural-conflicts-v4.json','utf8'));
          console.log('## Fase 6 · conflictos estructurales');
          for(const [k,v] of Object.entries(r.summary))console.log(`- ${k}: ${v}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: marvel-phase6-structural-conflicts-v4-${{ github.run_id }}
          path: artifacts/marvel-not-listed-v4/phase6-structural-conflicts-v4.json
          retention-days: 14
      - name: Commit research result only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-not-listed-v4/phase6-structural-conflicts-v4.json
          git commit -m 'audit: guardar conflictos estructurales fase 6 v4' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

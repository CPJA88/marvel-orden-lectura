name: Publish Marvel tail A2 and B v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-marvel-tail-a2-b-v4.mjs'
      - '.github/workflows/publish-marvel-tail-a2-b-v4.yml'

permissions:
  contents: write

concurrency:
  group: publish-marvel-tail-a2-b-v4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate publisher
        run: node --check scripts/publish-marvel-tail-a2-b-v4.mjs
      - name: Publish verified A2+B rows only
        run: node scripts/publish-marvel-tail-a2-b-v4.mjs
      - name: Validate reader fallback
        run: |
          node --check source/marvel-reader-fallback-v1240.js
          node scripts/test-marvel-reader-fallback-v1240.mjs
      - name: Build PWA
        run: npm run build
      - name: Validate published build
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/tail-a2-b-publish-summary.json','utf8'));
          const src=JSON.parse(fs.readFileSync('source/marvel-cache/index.json','utf8'));
          const built=JSON.parse(fs.readFileSync('public/data/marvel-cache/index.json','utf8'));
          if(src.localCount!==51002||built.localCount!==51002)throw new Error('localCount cambió.');
          for(const k of ['matched','noDigital','notListed','linkReady','linkMissing','readerFallbackReady','functionalLinkReady','functionalLinkMissing'])if(Number(src[k])!==Number(s.after[k])||Number(built[k])!==Number(s.after[k]))throw new Error(`Conteo ${k} inconsistente.`);
          if(Number(s.changedRows)+Number(s.unchangedRows)!==51002)throw new Error('Scope inválido.');
          if(Number(s.after.functionalLinkMissing)!==0)throw new Error('Quedaron MU sin enlace.');
          console.log('A2+B publicado y validado',s.after);
          NODE
      - name: Commit verified A2+B publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/marvel-cache/index.json source/marvel-reader-fallback-v1240.js artifacts/marvel-not-listed-v4/tail-a2-b-publish-summary.json
          if git diff --cached --quiet; then echo 'No hay cambios publicables.'; exit 0; fi
          git commit -m 'cache: publicar resultados A2 y B v4 verificados'
          git pull --rebase origin main
          git push origin HEAD:main

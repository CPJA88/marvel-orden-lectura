name: Prebuild Marvel cache

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-marvel-cache.mjs'
      - 'scripts/run-marvel-cache-batched.mjs'
      - '.github/workflows/prebuild-marvel-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-preinstalled-cache-v3
  cancel-in-progress: true

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate batched runner syntax
        run: node --check scripts/run-marvel-cache-batched.mjs

      - name: Restore prebuild checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .cache/marvel-prebuild-v3
          key: marvel-v3-${{ runner.os }}-${{ hashFiles('Marvel_Orden_de_Lectura_PWA.zip', 'scripts/generate-marvel-cache.mjs', 'scripts/run-marvel-cache-batched.mjs') }}-${{ github.run_id }}
          restore-keys: |
            marvel-v3-${{ runner.os }}-${{ hashFiles('Marvel_Orden_de_Lectura_PWA.zip', 'scripts/generate-marvel-cache.mjs', 'scripts/run-marvel-cache-batched.mjs') }}-
            marvel-v3-${{ runner.os }}-

      - name: Generate and verify complete preinstalled cache
        id: generate
        run: NODE_OPTIONS=--max-old-space-size=4096 REFRESH_CATALOG=1 node --expose-gc scripts/run-marvel-cache-batched.mjs

      - name: Save checkpoint after generation
        if: steps.generate.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/marvel-prebuild-v3
          key: marvel-v3-${{ runner.os }}-${{ hashFiles('Marvel_Orden_de_Lectura_PWA.zip', 'scripts/generate-marvel-cache.mjs', 'scripts/run-marvel-cache-batched.mjs') }}-${{ github.run_id }}

      - name: Save checkpoint if generation fails
        if: failure() && steps.generate.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: .cache/marvel-prebuild-v3
          key: marvel-v3-${{ runner.os }}-${{ hashFiles('Marvel_Orden_de_Lectura_PWA.zip', 'scripts/generate-marvel-cache.mjs', 'scripts/run-marvel-cache-batched.mjs') }}-${{ github.run_id }}

      - name: Preserve generated cache candidate
        if: steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: marvel-cache-v3-candidate-${{ github.run_id }}
          path: source/marvel-cache/index.json
          retention-days: 3
          if-no-files-found: error

      - name: Validate cache strictly
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('source/marvel-cache/index.json','utf8'));
          if(!p.ready) throw new Error('cache ready=false');
          if(Number(p.version) < 3) throw new Error(`formato sin verificación oficial: v${p.version}`);
          if(p.officiallyVerified !== true) throw new Error('officiallyVerified=false');
          if(p.localCount < 50000) throw new Error(`localCount incompleto: ${p.localCount}`);
          if(!Array.isArray(p.entries) || p.entries.length !== p.localCount) throw new Error('entries incompleto');
          if(Number(p.unknown)!==0) {
            const rows=p.entries.filter(r=>Number(r?.[3])===0).map(r=>r?.[0]);
            console.error('GCD unknown:',rows);
            throw new Error(`quedan ${p.unknown} números unknown`);
          }
          if(Number(p.ambiguous)!==0) {
            const rows=p.entries.filter(r=>Number(r?.[3])===2).map(r=>r?.[0]);
            console.error('GCD ambiguos:',rows);
            throw new Error(`quedan ${p.ambiguous} coincidencias ambiguas`);
          }
          const terminal=Number(p.matched||0)+Number(p.unavailable||0)+Number(p.notListed||0);
          if(terminal!==Number(p.localCount)) throw new Error(`clasificación no terminal: ${terminal}/${p.localCount}`);
          for(const row of p.entries){
            const status=Number(row?.[3]);
            if(![1,3,4,5].includes(status)) throw new Error(`estado no terminal ${status} en GCD ${row?.[0]}`);
            if(status===1&&(!row?.[1]||!row?.[2]||!row?.[5])) throw new Error(`Unlimited sin sourceId/readerId/DRN en GCD ${row?.[0]}`);
            if(status===5&&(!row?.[1]||!row?.[2])) throw new Error(`Unlimited verificado sin sourceId/readerId en GCD ${row?.[0]}`);
            if(status===3&&!row?.[1]) throw new Error(`noDigital sin sourceId oficial en GCD ${row?.[0]}`);
          }
          const byGcd=new Map(p.entries.map(r=>[Number(r?.[0]),r]));
          const captainAmericaNoDigitalGcd=[2786,2854,2912,2957,3013,3075,3126,3617];
          for(const gcdId of captainAmericaNoDigitalGcd){
            const row=byGcd.get(gcdId);
            if(!row) throw new Error(`regresión: Captain America GCD ${gcdId} no está en la caché`);
            if(![3,4].includes(Number(row[3]))) throw new Error(`regresión: Captain America GCD ${gcdId} no debe tener enlace Unlimited; estado=${row[3]}, sourceId=${row[1]}`);
          }
          console.log({localCount:p.localCount,catalogCount:p.catalogCount,verifiedMU:p.matched,noDigital:p.unavailable,notListed:p.notListed,ambiguous:p.ambiguous,unknown:p.unknown,linkReady:p.linkReady,linkMissing:p.linkMissing,officiallyVerified:p.officiallyVerified});
          NODE

      - name: Commit generated cache
        run: |
          if git diff --quiet -- source/marvel-cache/index.json; then
            echo 'La caché no ha cambiado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/marvel-cache/index.json
          git commit -m 'cache: publicar índice Marvel V3 verificado por serie y año'
          git pull --rebase origin main
          git push origin HEAD:main

name: Test Marvel reader fallback v1.2.41

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/marvel-reader-fallback-v1240.js'
      - 'source/stability-v22.js'
      - 'scripts/test-marvel-reader-fallback-v1240.mjs'
      - 'scripts/prepare.mjs'
      - '.github/workflows/test-marvel-reader-fallback-v1240.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check fallback and stability syntax
        run: |
          node --check source/marvel-reader-fallback-v1240.js
          node --check source/stability-v22.js
      - name: Test complete reader fallback allowlist
        run: node scripts/test-marvel-reader-fallback-v1240.mjs
      - name: Build PWA
        run: npm run build
      - name: Verify build and functional link coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pack=JSON.parse(fs.readFileSync('source/marvel-cache/index.json','utf8'));
          if(pack.localCount!==51002)throw new Error(`localCount=${pack.localCount}`);
          if(pack.matched!==31801)throw new Error(`matched=${pack.matched}`);
          if(pack.linkReady!==27912)throw new Error(`linkReady=${pack.linkReady}`);
          if(pack.readerFallbackReady!==3889)throw new Error(`readerFallbackReady=${pack.readerFallbackReady}`);
          if(pack.functionalLinkReady!==pack.matched)throw new Error(`functionalLinkReady=${pack.functionalLinkReady}; matched=${pack.matched}`);
          if(pack.functionalLinkMissing!==0)throw new Error(`functionalLinkMissing=${pack.functionalLinkMissing}`);
          if(!Array.isArray(pack.readerFallbackGcdIds)||pack.readerFallbackGcdIds.length!==pack.readerFallbackReady)throw new Error('Allowlist reader incompleta.');
          const html=fs.readFileSync('public/index.html','utf8');
          for(const script of ['marvel-reader-fallback-v1240.js','stability-v22.js']){
            if(!html.includes(script))throw new Error(`${script} no se inyectó en public/index.html`);
            if(!fs.existsSync(`public/${script}`))throw new Error(`${script} no se copió a public/`);
          }
          const built=JSON.parse(fs.readFileSync('public/data/marvel-cache/index.json','utf8'));
          if(JSON.stringify([built.localCount,built.matched,built.functionalLinkReady,built.functionalLinkMissing])!==JSON.stringify([51002,31801,31801,0]))throw new Error('El build alteró la cobertura funcional.');
          console.log('Build validado: 31.801 títulos Unlimited con enlace funcional y 0 pendientes.');
          NODE
      - name: Publish successful validation marker
        run: |
          mkdir -p artifacts/marvel-reader-fallback-v1240
          node - <<'NODE'
          const fs=require('fs');
          const pack=JSON.parse(fs.readFileSync('source/marvel-cache/index.json','utf8'));
          const payload={
            version:'1.2.41',
            validatedAt:new Date().toISOString(),
            runId:process.env.GITHUB_RUN_ID,
            testedCommit:process.env.GITHUB_SHA,
            targets:pack.readerFallbackReady,
            fallbackMode:'official-reader-smartlink',
            cache:{
              localCount:pack.localCount,
              matched:pack.matched,
              uuidLinkReady:pack.linkReady,
              readerFallbackReady:pack.readerFallbackReady,
              functionalLinkReady:pack.functionalLinkReady,
              functionalLinkMissing:pack.functionalLinkMissing,
            },
            result:'pass'
          };
          fs.mkdirSync('artifacts/marvel-reader-fallback-v1240',{recursive:true});
          fs.writeFileSync('artifacts/marvel-reader-fallback-v1240/validation.json',JSON.stringify(payload,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/marvel-reader-fallback-v1240/validation.json
          git commit -m 'test: validar fallback reader v1.2.41'
          git pull --rebase origin main
          git push origin HEAD:main

name: Publish Marvel clean candidates DRM v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-marvel-clean-candidates-drm-v4.mjs'
      - '.github/workflows/publish-marvel-clean-candidates-drm-v4.yml'

permissions:
  contents: write

concurrency:
  group: publish-marvel-clean-candidates-drm-v4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Snapshot reader fallback
        run: sha256sum source/marvel-reader-fallback-v1240.js > /tmp/fallback.sha
      - name: Validate publisher
        run: node --check scripts/publish-marvel-clean-candidates-drm-v4.mjs
      - name: Publish 1913 verified UUID deeplinks
        run: node scripts/publish-marvel-clean-candidates-drm-v4.mjs
      - name: Verify fallback unchanged
        run: sha256sum -c /tmp/fallback.sha
      - name: Validate reader fallbacks
        run: node scripts/test-marvel-reader-fallback-v1240.mjs
      - name: Build PWA
        run: npm run build
      - name: Validate final cache
        run: |
          node - <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('source/marvel-cache/index.json','utf8'));const s=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/clean-candidates-drm-v4-publish-summary.json','utf8'));
          if(p.entries.length!==51002||p.matched!==31102||p.noDigital!==1135||p.notListed!==18765||p.functionalLinkReady!==31102||p.functionalLinkMissing!==0)throw new Error('Conteos finales incorrectos');
          if(s.changedRows!==1913||s.promotedMU!==1913||s.promotedUuid!==1913||s.remainingUnresolvedFromPass!==70||s.unchangedRows!==49089)throw new Error('Scope final incorrecto');console.log(JSON.stringify(s.after,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: marvel-clean-candidates-drm-v4-publish-${{ github.run_id }}
          path: artifacts/marvel-not-listed-v4/clean-candidates-drm-v4-publish-summary.json
          retention-days: 14
      - name: Commit verified clean-candidate publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/marvel-cache/index.json artifacts/marvel-not-listed-v4/clean-candidates-drm-v4-publish-summary.json
          git commit -m 'cache: publicar 1913 DRM verificados v4' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Publish Marvel phase7 safe 1661 v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-marvel-phase7-safe-1661-v4.mjs'
      - '.github/workflows/publish-marvel-phase7-safe-1661-v4.yml'

permissions:
  contents: write

concurrency:
  group: publish-marvel-phase7-safe-1661-v4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Snapshot reader fallback
        run: sha256sum source/marvel-reader-fallback-v1240.js > /tmp/fallback.sha
      - name: Validate publisher
        run: node --check scripts/publish-marvel-phase7-safe-1661-v4.mjs
      - name: Publish verified phase7 results
        run: node scripts/publish-marvel-phase7-safe-1661-v4.mjs
      - name: Verify fallback unchanged
        run: sha256sum -c /tmp/fallback.sha
      - name: Test reader fallback
        run: node scripts/test-marvel-reader-fallback-v1240.mjs
      - name: Build
        run: npm run build
      - name: Validate final cache
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('source/marvel-cache/index.json','utf8'));
          const s=JSON.parse(fs.readFileSync('artifacts/marvel-not-listed-v4/phase7-safe-1661-publish-summary-v4.json','utf8'));
          if(p.entries?.length!==51002||p.localCount!==51002)throw new Error('Total inválido');
          if(p.matched!==31801||p.noDigital!==2172||p.notListed!==17029||p.linkReady!==27912||p.readerFallbackReady!==3889||p.functionalLinkReady!==31801||p.functionalLinkMissing!==0)throw new Error(`Conteos finales inválidos ${p.matched}/${p.noDigital}/${p.notListed}/${p.linkReady}/${p.readerFallbackReady}/${p.functionalLinkReady}/${p.functionalLinkMissing}`);
          if(s.changedRows!==1661||s.promotedMU!==624||s.promotedUuid!==624||s.confirmedNoDigital!==1037||s.unchangedRows!==49341)throw new Error('Resumen de publicación inválido');
          if(new Set(p.entries.map(r=>Number(r[0]))).size!==51002)throw new Error('GCD duplicados/perdidos');
          console.log(JSON.stringify(s,null,2));
          NODE
      - name: Commit cache publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/marvel-cache/index.json artifacts/marvel-not-listed-v4/phase7-safe-1661-publish-summary-v4.json
          git commit -m 'cache: publicar 1661 resultados seguros fase 7' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

plugins {
    id 'com.android.application'
}

android {
    namespace 'es.pokeapps.marvellectura'
    compileSdk 35

    defaultConfig {
        applicationId 'es.pokeapps.marvellectura'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        buildConfigField 'String', 'APP_URL', '"https://marvel-orden-lectura.pokeapps.workers.dev/"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
